server.port=8080

# ---- MySQL connection ----
spring.datasource.url=${SPRING_DATASOURCE_URL:jdbc:mysql://localhost:3306/camsdb?createDatabaseIfNotExist=true&useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Hibernate creates/updates tables automatically from the @Entity classes
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# ---- JWT Security Configuration ----
jwt.secret=${JWT_SECRET}
# Token expiration per role in milliseconds:
# Applicant: 8 hours (28,800,000 ms)
jwt.expiration.applicant=28800000
# Staff (Counsellor, Coordinator, Registrar, Finance): 12 hours (43,200,000 ms)
jwt.expiration.staff=43200000
# Admin: 24 hours (86,400,000 ms)
jwt.expiration.admin=86400000

# ---- Multipart File Upload Configuration ----
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=15MB

# ---- Institution info ----
cams.institution.name=College Admission Management System
cams.academic.year=2026-27
cams.active.round=1
